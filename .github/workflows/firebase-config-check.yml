name: Firebase authentication check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Firebase Web App and API key
        shell: bash
        run: |
          set -euo pipefail

          API_KEY="$(sed -n 's/.*apiKey: "[^"]*\|.*//p' src/lib/firebase.ts >/dev/null; grep -oP 'apiKey:\s*"\K[^"]+' src/lib/firebase.ts | head -1)"
          PROJECT_ID="$(grep -oP 'projectId:\s*"\K[^"]+' src/lib/firebase.ts | head -1)"
          APP_ID="$(grep -oP 'appId:\s*"\K[^"]+' src/lib/firebase.ts | head -1)"

          test -n "$API_KEY"
          test -n "$PROJECT_ID"
          test -n "$APP_ID"

          echo "Project: $PROJECT_ID"
          echo "Firebase App ID: $APP_ID"
          echo "API key prefix: ${API_KEY:0:10}"

          CONFIG="$(curl -fsS --get             --data-urlencode "firebaseAppId=$APP_ID"             "https://identitytoolkit.googleapis.com/v1/projects")"

          REMOTE_PROJECT="$(printf '%s' "$CONFIG" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).projectId||""))')"

          if [ "$REMOTE_PROJECT" != "$PROJECT_ID" ]; then
            echo "Firebase App ID resolves to: $REMOTE_PROJECT"
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             --data '{"providerId":"google.com","continueUri":"https://moh-ac-32000-del.github.io/accounting-assistant-merchant-ledger/"}'             "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$API_KEY")"

          echo "Identity Toolkit createAuthUri HTTP status: $HTTP_CODE"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.providerId!=="google.com") process.exit(1);' "$RESPONSE_FILE"

          echo "Firebase API key and Google authentication endpoint are valid.";
