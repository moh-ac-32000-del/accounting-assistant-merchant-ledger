name: Firebase live diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    if: "!startsWith(github.event.head_commit.message, '[diagnostic]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Firebase Authentication API key
        run: |
          set -euo pipefail
          API_KEY="$(grep -oP 'apiKey:\s*"\K[^"]+' src/lib/firebase.ts | head -1)"
          HTTP_CODE="$(curl -sS -o /tmp/firebase-response.json -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             --data '{"providerId":"google.com","continueUri":"https://moh-ac-32000-del.github.io/accounting-assistant-merchant-ledger/"}'             "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$API_KEY")"

          node -e 'const fs=require("fs"); const body=fs.readFileSync("/tmp/firebase-response.json","utf8"); const r={httpStatus:Number(process.argv[1]),response:(()=>{try{return JSON.parse(body)}catch{return {raw:body}}})(),testedAt:new Date().toISOString()}; fs.writeFileSync("firebase-live-diagnostic.json",JSON.stringify(r,null,2)+"\\n"); console.log(JSON.stringify(r,null,2));' "$HTTP_CODE"

      - name: Publish diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-live-diagnostic.json
          git commit -m "[diagnostic] Firebase live result" || exit 0
          git push
